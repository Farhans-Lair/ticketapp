version: "3.9"

services:

  # MySQL database
  db:
    image: mysql:8.0
    container_name: ticketapp_db
    restart: unless-stopped

    # ✅ FIX: Force MySQL to use caching_sha2_password
    command: --default-authentication-plugin=caching_sha2_password

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${DB_NAME:-ticket_db}
      MYSQL_USER:          ${DB_USER:-ticket_user}
      MYSQL_PASSWORD:      ${DB_PASS:-ticketpass}

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
      # NOTE: this used to mount SQL files from a legacy ./db/ folder (organizer_migration.sql,
      # a nonexistent init-auth.sql) to seed the schema. That folder has been removed — it had
      # drifted out of sync with the real schema. Local dev now relies on the same mechanism as
      # before Flyway was introduced for prod: spring.jpa.hibernate.ddl-auto=update (the default,
      # non-prod profile setting) builds the schema from the JPA entities on first boot. If you
      # need prod-parity locally, set SPRING_PROFILES_ACTIVE=prod on the backend service below —
      # Flyway will then apply src/main/resources/db/migration/V1..V11 instead.

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (OTP store) Replaces the in-memory ConcurrentHashMap used by OtpStore.
  redis:
    image: redis:7-alpine
    container_name: ticketapp_redis
    restart: unless-stopped
    # No auth in local dev.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Spring Boot backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketapp_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      # Database
      DB_HOST:     db
      DB_PORT:     3306
      DB_NAME:     ${DB_NAME:-ticket_db}
      DB_USER:     ${DB_USER:-ticket_user}
      DB_PASS:     ${DB_PASS:-ticketpass}

      # JWT — separate secret per token type (access/refresh/session)
      JWT_ACCESS_SECRET:   ${JWT_ACCESS_SECRET:-changeme-access-secret-min-32-chars-x}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET:-changeme-refresh-secret-min-32-chars}
      JWT_SESSION_SECRET:  ${JWT_SESSION_SECRET:-changeme-session-secret-min-32-chars}

      # Cookie
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Email
      EMAIL_USER:  ${EMAIL_USER:-}
      EMAIL_PASS:  ${EMAIL_PASS:-}

      # AWS S3
      AWS_REGION:            ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME:        ${S3_BUCKET_NAME:-}

      # Razorpay
      RAZORPAY_KEY_ID:     ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

      # Frontend URL (for CORS)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}

      # Redis (OTP store)
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Admin notifications
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

    # NOTE: no volume mount for the frontend here. The frontend lives at
    # src/main/resources/static and is baked into the jar by the Maven build
    # (see Dockerfile) — there is no separate ./frontend directory to mount.

volumes:
  db_data: